<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real Sketch Generator</title>
    <style>
        /* --- CSS STYLING (Dark Blue & Bright Green Theme) --- */
        :root {
            --bg-dark-blue: #0a192f;
            --card-blue: #112240;
            --bright-green: #64ffda;
            --neon-green-glow: #00ff66;
            --text-white: #e6f1ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark-blue);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background-color: var(--card-blue);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.15);
            border: 1px solid rgba(100, 255, 218, 0.2);
            text-align: center;
        }

        h1 {
            color: var(--bright-green);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            font-size: 2rem;
        }

        p {
            color: #8892b0;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid var(--bright-green);
            background-color: var(--bg-dark-blue);
            color: var(--text-white);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px var(--neon-green-glow);
        }

        button {
            padding: 15px 25px;
            background-color: var(--bright-green);
            color: var(--bg-dark-blue);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #00ffaa;
            box-shadow: 0 0 15px var(--neon-green-glow);
            transform: translateY(-2px);
        }

        .canvas-area {
            min-height: 350px;
            background-color: var(--bg-dark-blue);
            border: 2px dashed rgba(100, 255, 218, 0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #sketch-result {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 2px solid var(--bright-green);
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        #loading {
            color: var(--bright-green);
            font-weight: bold;
            font-size: 18px;
            animation: blink 1.5s infinite;
        }

        .hidden {
            display: none !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ AI Real Sketch Artist ⚡</h1>
        <p>Type what you want to draw, and the AI neural network will sketch it.</p>
        
        <div class="search-box">
            <input type="text" id="sketch-input" placeholder="e.g., A sports car, a flying dragon, a rose...">
            <button id="generate-btn">Sketch It!</button>
        </div>

        <div class="canvas-area">
            <div id="loading" class="hidden">The AI is drawing your sketch... ✏️</div>
            <img id="sketch-result" src="" alt="Your AI Sketch will appear here" class="hidden">
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', generateSketch);
        document.getElementById('sketch-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateSketch();
        });

        function generateSketch() {
            const inputElement = document.getElementById('sketch-input');
            const promptText = inputElement.value.trim();
            
            const loadingElement = document.getElementById('loading');
            const resultImage = document.getElementById('sketch-result');

            if (!promptText) {
                alert('Please enter a sketch term!');
                return;
            }

            loadingElement.classList.remove('hidden');
            resultImage.classList.add('hidden');

            // System prompt forcing realistic sketch textures and layout formats
            const cleanPrompt = encodeURIComponent(`A beautiful fine black and white detailed pencil sketch art drawing of ${promptText}, charcoal drawing style, sharp lines, isolated on a solid white background, high contrast`);

            // CHANGED ENDPOINT: Switched to the public keyless image channel with Flux modeling rules enabled
            const finalImageSrc = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=768&height=768&nologo=true&model=flux&seed=${Math.floor(Math.random() * 999999)}`;

            // Safe memory preload cache verification
            const imgBuffer = new Image();
            imgBuffer.src = finalImageSrc;

            imgBuffer.onload = function() {
                resultImage.src = finalImageSrc;
                resultImage.classList.remove('hidden');
                loadingElement.classList.add('hidden');
            };

            imgBuffer.onerror = function() {
                loadingElement.classList.add('hidden');
                alert("The AI pipeline is busy. Please verify your internet connection and try clicking again.");
            };
        }
    </script>
</body>
</html>
